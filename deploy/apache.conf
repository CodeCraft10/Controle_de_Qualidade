<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>
    # Mantém Authorization disponível ao PHP.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    ErrorLog /proc/self/fd/2
    # Não registra query strings, corpos ou cabeçalhos de autenticação.
    CustomLog /proc/self/fd/1 "%h %t %m %U %>s"
</VirtualHost>
