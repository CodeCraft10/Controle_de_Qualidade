services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${GP4_DB_NAME:-gp4}
      MYSQL_USER: ${GP4_DB_USER:-gp4}
      MYSQL_PASSWORD: ${GP4_DB_PASSWORD:?Defina GP4_DB_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${GP4_DB_ROOT_PASSWORD:?Defina GP4_DB_ROOT_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${GP4_DB_PORT:-3306}:3306"
    volumes:
      - gp4-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DATABASE_DSN: "mysql:host=database;port=3306;dbname=${GP4_DB_NAME:-gp4};charset=utf8mb4"
      DATABASE_USER: ${GP4_DB_USER:-gp4}
      DATABASE_PASSWORD: ${GP4_DB_PASSWORD:?Defina GP4_DB_PASSWORD no arquivo .env}
    command: ["php", "bin/migrate.php"]
    depends_on:
      database:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      database:
        condition: service_healthy

  app:
    environment:
      DATABASE_DSN: "mysql:host=database;port=3306;dbname=${GP4_DB_NAME:-gp4};charset=utf8mb4"
      DATABASE_USER: ${GP4_DB_USER:-gp4}
      DATABASE_PASSWORD: ${GP4_DB_PASSWORD:?Defina GP4_DB_PASSWORD no arquivo .env}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  gp4-mysql:
