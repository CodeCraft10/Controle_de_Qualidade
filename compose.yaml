services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    environment:
      APP_ENV: production
      STORAGE_PATH: var/state.json
      TOKEN_TTL: 28800
    volumes:
      - gp4-state:/var/www/html/backend/var
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/api/health') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  gp4-state:
