  name: Backend PHP e frontend

on:
  workflow_dispatch:
  pull_request:
    paths: ['frontend/**', 'backend/**', 'public/**', 'deploy/**', 'tests/**', 'Dockerfile', '.dockerignore', 'compose.yaml', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['frontend/**', 'backend/**', 'public/**', 'deploy/**', 'tests/**', 'Dockerfile', '.dockerignore', 'compose.yaml', '.github/workflows/frontend.yml']

permissions:
  contents: read

jobs:
  backend:
    name: Backend PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo
          coverage: none
      - name: Verificar sintaxe PHP
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Testar regras e permissões
        run: php tests/run.php
      - name: Testar API HTTP e fotos
        run: php tests/http.php
      - name: Testar transações concorrentes
        run: php tests/concurrency.php

  validate:
    name: Frontend integrado (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run format:check
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo
          coverage: none
      - run: npx playwright install --with-deps chromium
      - name: Testar frontend integrado ao index PHP
        run: npm test
      - name: Testar entrada pública e arquivos privados
        working-directory: .
        run: python3 tests/entrypoint.py

  deployment:
    name: Pacote VPS (Apache)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuração Compose
        run: docker compose config --quiet
      - name: Construir aplicação integrada
        run: docker build -t gp4-integrado .
      - name: Testar imagem Apache descartável
        run: python3 tests/entrypoint.py --docker-image gp4-integrado
